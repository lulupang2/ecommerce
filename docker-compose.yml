services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: canvas, POSTGRES_PASSWORD: canvas, POSTGRES_DB: postgres }
    volumes: ["./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U canvas"], interval: 5s, timeout: 3s, retries: 20 }
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  auth: &service
    build: { context: . , dockerfile: backend/Dockerfile }
    command: node backend/services/auth/server.js
    environment: { PORT: 3001, DATABASE_URL: postgres://canvas:canvas@postgres:5432/auth, RABBIT_URL: amqp://rabbitmq:5672, JWT_SECRET: canvas-local-secret, ADMIN_EMAIL: admin@techzone.local, ADMIN_PASSWORD: TechzoneAdmin123!, ADMIN_NAME: TECHZONE Admin }
    depends_on: { postgres: { condition: service_healthy }, rabbitmq: { condition: service_healthy } }
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health >/dev/null || exit 1"], interval: 5s, timeout: 3s, retries: 12, start_period: 5s }
  catalog:
    <<: *service
    command: node backend/services/catalog/server.js
    environment: { PORT: 3002, DATABASE_URL: postgres://canvas:canvas@postgres:5432/catalog, RABBIT_URL: amqp://rabbitmq:5672, JWT_SECRET: canvas-local-secret }
  cart:
    <<: *service
    command: node backend/services/cart/server.js
    environment: { PORT: 3003, DATABASE_URL: postgres://canvas:canvas@postgres:5432/cart, RABBIT_URL: amqp://rabbitmq:5672 }
  order:
    <<: *service
    command: node backend/services/order/server.js
    environment: { PORT: 3004, DATABASE_URL: postgres://canvas:canvas@postgres:5432/orders, RABBIT_URL: amqp://rabbitmq:5672, JWT_SECRET: canvas-local-secret }
  payment:
    <<: *service
    command: node backend/services/payment/server.js
    environment: { PORT: 3005, DATABASE_URL: postgres://canvas:canvas@postgres:5432/payments, RABBIT_URL: amqp://rabbitmq:5672, TOSS_SECRET_KEY: "${TOSS_SECRET_KEY:-}" }
  inventory:
    <<: *service
    command: node backend/services/inventory/server.js
    environment: { PORT: 3006, DATABASE_URL: postgres://canvas:canvas@postgres:5432/inventory, RABBIT_URL: amqp://rabbitmq:5672, JWT_SECRET: canvas-local-secret }
  notification:
    <<: *service
    command: node backend/services/notification/server.js
    environment: { PORT: 3007, DATABASE_URL: postgres://canvas:canvas@postgres:5432/notifications, RABBIT_URL: amqp://rabbitmq:5672 }
  search:
    <<: *service
    command: node backend/services/search/server.js
    environment: { PORT: 3008, DATABASE_URL: postgres://canvas:canvas@postgres:5432/search, RABBIT_URL: amqp://rabbitmq:5672, CATALOG_URL: http://catalog:3002 }
  media:
    <<: *service
    command: node backend/services/media/server.js
    environment: { PORT: 3009, DATABASE_URL: postgres://canvas:canvas@postgres:5432/media, RABBIT_URL: amqp://rabbitmq:5672 }
  gateway:
    <<: *service
    command: node backend/services/gateway/server.js
    environment: { PORT: 8080, AUTH_URL: http://auth:3001, CATALOG_URL: http://catalog:3002, CART_URL: http://cart:3003, ORDER_URL: http://order:3004, PAYMENT_URL: http://payment:3005, INVENTORY_URL: http://inventory:3006, NOTIFICATION_URL: http://notification:3007, SEARCH_URL: http://search:3008, MEDIA_URL: http://media:3009 }
    ports: ["18080:8080"]
    depends_on: [auth, catalog, cart, order, payment, inventory, notification, search, media]
  web:
    build: { context: . , dockerfile: frontend.Dockerfile }
    ports: ["15173:80"]
    depends_on: [gateway]
