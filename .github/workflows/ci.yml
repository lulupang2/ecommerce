name: TECHZONE CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run generate:api
      - run: git diff --exit-code -- packages/api-client/src/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run test:deployment
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    needs: static-and-contract
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4
      - name: Build cached service image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/service.Dockerfile
          load: true
          tags: techzone-service:local
          provenance: false
          cache-from: type=gha,scope=techzone-service
          cache-to: type=gha,scope=techzone-service,mode=max,ignore-error=true
      - name: Build cached storefront image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          build-args: APP_NAME=storefront
          load: true
          tags: techzone-storefront:local
          provenance: false
          cache-from: type=gha,scope=techzone-storefront
          cache-to: type=gha,scope=techzone-storefront,mode=max,ignore-error=true
      - name: Build cached admin image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          build-args: APP_NAME=admin
          load: true
          tags: techzone-admin:local
          provenance: false
          cache-from: type=gha,scope=techzone-admin
          cache-to: type=gha,scope=techzone-admin,mode=max,ignore-error=true
      - run: docker compose up -d --no-build
      - run: npm run test:security
      - run: npm run test:integration
      - run: npm run test:storefront
      - run: npm run test:browser-e2e
      - run: npm run test:lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
      - run: npm run test:resilience
      - if: always()
        run: docker compose logs --no-color > docker-compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: docker-compose-logs, path: docker-compose.log }
      - if: always()
        run: docker compose down -v

  deployment-contracts:
    runs-on: ubuntu-latest
    needs: static-and-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run --silent k8s:render > /tmp/techzone-k8s.json
      - run: npm run --silent k8s:validate -- /tmp/techzone-k8s.json
