global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:9464"] }]
  - job_name: techzone-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:8080
          - auth:3001
          - catalog:3002
          - cart:3003
          - order:3004
          - payment:3005
          - inventory:3006
          - notification:3007
          - search:3008
          - media:3009
          - fulfillment:3010
          - procurement:3011
          - admin:3012
