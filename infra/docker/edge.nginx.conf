server {
  listen 8080;
  server_name _;
  client_max_body_size 2m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $gateway_upstream http://gateway:8080;
    proxy_pass $gateway_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /admin/ {
    set $admin_upstream http://admin-web:3001;
    proxy_pass $admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    set $storefront_upstream http://storefront:3000;
    proxy_pass $storefront_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }
}
